<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>物資寄送備查｜2026 日月潭 Come!BikeDay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Lilita+One&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Lilita+One&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #cdeaf8; --sky-2: #e8f6fd; --cream: #fdf4d6; --red: #e8452c; --red-d: #c9361f;
    --navy: #1f2a44; --ink: #1f2a44; --muted: #56607a; --card: #ffffff;
    --grass: #8fd07c; --forest: #3f9a6a; --lake: #7cc6ee; --sun: #f9c45e; --leaf: #ef8a4c;
    --blue: #2b8fd6; --line: #d9dfe9; --soft: #eef7fc;
    --warn-bg: #fff1c2; --warn: #7a5600;
    --bd: 2.5px solid var(--navy); --sh: 4px 4px 0 var(--navy);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; color: var(--ink);
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    background: var(--cream);
  }

  /* ---------- 海報風頁首 ---------- */
  header { position: relative; overflow: hidden; background: var(--sky); padding: 26px 0 0; text-align: center; }
  .logo { position: relative; z-index: 2; font-family: "Lilita One", "Arial Black", sans-serif; font-size: clamp(40px, 8vw, 64px); line-height: .95; color: var(--red); letter-spacing: 1px; text-shadow: 0 2px 0 rgba(31,42,68,.08); }
  .logo .bang { display: inline-block; transform: rotate(8deg); }
  .tagline { position: relative; z-index: 2; font-family: "Caveat", cursive; font-weight: 700; font-size: clamp(18px, 3vw, 24px); color: var(--navy); margin-top: 2px; }
  .sys { position: relative; z-index: 2; display: inline-flex; align-items: center; gap: 10px; margin-top: 12px; padding: 6px 16px; background: #fff; border: var(--bd); border-radius: 999px; box-shadow: 3px 3px 0 var(--navy); font-weight: 900; font-size: 17px; letter-spacing: 1px; }
  .sys .date { font-family: "Lilita One", sans-serif; color: var(--red); letter-spacing: .5px; font-weight: 400; }
  .scene { display: block; width: 100%; height: 150px; margin-top: -18px; position: relative; z-index: 1; }
  .logo, .tagline { padding: 0 16px; }

  main { max-width: 760px; margin: 0 auto; padding: 6px 16px 40px; }
  .card { background: var(--card); border: var(--bd); border-radius: 18px; padding: 20px; box-shadow: var(--sh); margin-bottom: 18px; }

  /* 搜尋 */
  .search { display: flex; gap: 10px; }
  .search input {
    flex: 1; min-width: 0; font: inherit; font-size: 24px; font-weight: 700; letter-spacing: 1px;
    padding: 11px 14px; border: var(--bd); border-radius: 12px; background: var(--sky-2); color: var(--ink);
  }
  .search input:focus { outline: none; background: #fff; box-shadow: 0 0 0 4px rgba(124,198,238,.55); }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; }
  .btn { padding: 11px 22px; font-size: 18px; font-weight: 900; letter-spacing: 1px; background: var(--red); color: #fff; white-space: nowrap; border: var(--bd); box-shadow: 3px 3px 0 var(--navy); transition: transform .06s, box-shadow .06s; }
  .btn:hover { background: var(--red-d); }
  .btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--navy); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.blue { background: var(--blue); }
  .hint { margin: 10px 2px 0; color: var(--muted); font-size: 14px; }
  .msg { margin-top: 12px; font-weight: 700; color: var(--red-d); }

  /* 首頁統計 */
  h2 { margin: 0 0 4px; font-size: 19px; font-weight: 900; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stat { border: 2px solid var(--navy); border-radius: 14px; padding: 12px 8px; text-align: center; background: var(--sky-2); }
  .stat:nth-child(2) { background: #ffe9d8; }
  .stat:nth-child(3) { background: #e8f6df; }
  .stat:nth-child(4) { background: var(--cream); }
  .stat b { display: block; font-family: "Lilita One", sans-serif; font-weight: 400; font-size: 34px; line-height: 1.1; color: var(--navy); }
  .stat span { font-size: 13px; font-weight: 700; color: var(--muted); }

  /* 多筆結果 */
  .pick { display: block; width: 100%; text-align: left; background: var(--sky-2); padding: 13px 16px; margin-top: 10px; border: 2px solid var(--navy); border-radius: 12px; color: var(--ink); }
  .pick:hover { background: #d5eefb; }
  .pick .t { font-size: 18px; font-weight: 900; }
  .pick .s { font-size: 14px; color: var(--muted); margin-top: 3px; }

  /* 單號卡 */
  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
  .tid { font-family: "Lilita One", sans-serif; font-size: 34px; line-height: 1; color: var(--red); letter-spacing: .5px; }
  .tname { font-size: 23px; font-weight: 900; }
  .tn { color: var(--muted); font-size: 16px; font-weight: 500; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .badge { font-size: 14px; font-weight: 700; padding: 3px 11px; border-radius: 999px; background: #fff; border: 2px solid var(--navy); }
  .badge.pk { background: var(--sky-2); }
  .badge.box { background: #ffe1cc; }
  .badge.xs { background: var(--warn-bg); }
  .badge.on { background: #ece3ff; }
  .trk { margin-top: 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; background: var(--sky-2); border: 2px dashed var(--navy); border-radius: 14px; }
  .trk .lab { font-size: 13px; font-weight: 700; color: var(--muted); width: 100%; margin-bottom: -6px; }
  .trk code { font-family: Consolas, "Courier New", monospace; font-size: 32px; font-weight: 700; letter-spacing: 2px; color: var(--navy); }
  .trk code em { font-style: normal; color: var(--red); }
  .copy { padding: 9px 18px; font-size: 16px; font-weight: 900; background: var(--red); color: #fff; border: var(--bd); box-shadow: 3px 3px 0 var(--navy); }
  .copy:active { transform: translate(3px, 3px); box-shadow: none; }
  .copy.done { background: var(--forest); }
  .note { margin-top: 12px; padding: 12px 14px; border-radius: 12px; font-size: 16px; font-weight: 700; border: 2px solid var(--navy); }
  .note.xs { background: var(--warn-bg); color: var(--warn); }
  .note.on { background: #ece3ff; color: #4a2a84; }
  .caller { margin-top: 10px; font-size: 16px; font-weight: 700; color: var(--warn); }

  /* 分頁 */
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
  .tab { padding: 11px 6px; font-size: 17px; font-weight: 900; background: #fff; color: var(--navy); border: var(--bd); box-shadow: 3px 3px 0 var(--navy); transition: transform .06s, box-shadow .06s; }
  .tab:hover { background: var(--sky-2); }
  .tab.on { background: var(--navy); color: #fff; transform: translate(3px, 3px); box-shadow: none; }
  .tab .k { display: inline-block; font-family: "Lilita One", sans-serif; font-weight: 400; font-size: 13px; opacity: .6; margin-right: 5px; }
  .pane[hidden] { display: none; }
  .pane h3 { margin: 0 0 14px; font-size: 21px; font-weight: 900; }
  .pane h3 small { font-weight: 500; color: var(--muted); font-size: 14px; margin-left: 6px; }

  /* 物資 */
  .grp { margin-bottom: 16px; }
  .grp-t { font-size: 14px; color: var(--muted); font-weight: 900; margin-bottom: 8px; }
  .tiles { display: flex; flex-wrap: wrap; gap: 10px; }
  .tile { background: var(--sky-2); border: 2px solid var(--navy); border-radius: 12px; padding: 8px 14px; min-width: 92px; }
  .tile .n { font-size: 15px; font-weight: 700; }
  .tile .q { font-family: "Lilita One", sans-serif; font-weight: 400; font-size: 30px; line-height: 1.1; color: var(--navy); }
  .tile.hi { background: #ffe5dc; }
  .tile.hi .q { color: var(--red); }

  /* 成員 */
  .mem { border-top: 2px dotted var(--line); padding: 12px 2px; }
  .mem:first-of-type { border-top: 0; }
  .mem.me { background: var(--warn-bg); border: 2px solid var(--navy); border-radius: 12px; padding: 12px 10px; margin: 4px 0; }
  .mrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .bib { font-family: "Lilita One", sans-serif; font-size: 21px; color: var(--blue); min-width: 52px; }
  .mname { font-size: 19px; font-weight: 900; }
  .mrace, .mphone { font-size: 14px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: 14px; padding: 2px 9px; border-radius: 8px; background: var(--sky-2); border: 1.5px solid #b9cfe0; }
  .chip.hi { background: #ffe5dc; border-color: var(--red); color: var(--red-d); font-weight: 700; }

  /* 寄件資料 */
  dl { display: grid; grid-template-columns: 110px 1fr; gap: 10px 14px; margin: 0; font-size: 18px; }
  dt { color: var(--muted); font-size: 15px; font-weight: 700; padding-top: 2px; }
  dd { margin: 0; font-weight: 700; word-break: break-all; }

  /* 補寄 */
  .rec { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 14px; background: var(--sky-2); border: 2px solid var(--navy); border-radius: 12px; margin-bottom: 10px; }
  .rec code { font-family: Consolas, monospace; font-size: 22px; font-weight: 700; }
  .rec .d { font-size: 13px; color: var(--muted); }
  .rec .w { flex-basis: 100%; font-size: 16px; }
  .rec .del { margin-left: auto; background: none; color: var(--muted); font-size: 14px; text-decoration: underline; padding: 4px; }
  .form { display: grid; gap: 10px; margin-top: 10px; }
  .form input { font: inherit; font-size: 18px; padding: 10px 12px; border: var(--bd); border-radius: 10px; background: #fff; }
  .form input:focus { outline: none; box-shadow: 0 0 0 4px rgba(124,198,238,.55); }
  .form label { font-size: 14px; font-weight: 900; color: var(--muted); }
  .empty { color: var(--muted); padding: 6px 0 4px; }

  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 4px 16px 28px; line-height: 1.8; }
  footer button { background: none; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 4px 8px; }
  [hidden] { display: none !important; }
  /* 密碼鎖 */
  #lock { max-width: 420px; margin: 0 auto; padding: 6px 16px 40px; }
  #lock h1 { margin: 0 0 6px; font-size: 23px; font-weight: 900; text-align: center; color: var(--navy); }
  #lock p { margin: 0 0 16px; text-align: center; color: var(--muted); font-size: 15px; }
  #lock input { width: 100%; font: inherit; font-size: 24px; font-weight: 700; letter-spacing: 3px; text-align: center; padding: 12px; border: var(--bd); border-radius: 12px; background: var(--sky-2); }
  #lock input:focus { outline: none; background: #fff; box-shadow: 0 0 0 4px rgba(124,198,238,.55); }
  #lock .btn { width: 100%; margin-top: 12px; }
  #lock label.rm { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 12px; font-size: 14px; color: var(--muted); }
  #lock label.rm input { width: auto; }
  .sync { display: inline-block; margin-left: 6px; }
  .sync.err { color: #c62828; font-weight: 700; }
  .rec .by { font-size: 13px; color: var(--muted); }
  .warnbox { padding: 12px 14px; border-radius: 12px; background: #ffe9e9; color: #a3161a; font-weight: 700; margin-bottom: 12px; }
  @media (max-width: 560px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .trk code { font-size: 24px; letter-spacing: 1px; }
    .tab { font-size: 15px; padding: 10px 2px; }
    .tab .k { display: none; }
    .tabs { gap: 7px; }
    dl { grid-template-columns: 84px 1fr; font-size: 16px; }
    .search input { font-size: 20px; }
    .scene { height: 110px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">Come<span class="bang">!</span>BikeDay</div>
  <div class="tagline">Every Day is Come!BikeDay.</div>
  <div class="sys">物資寄送備查系統 <span class="date">11.21 SAT.</span></div>
  <svg class="scene" viewBox="0 0 1200 200" preserveAspectRatio="xMidYMax slice" aria-hidden="true">

</header>

<section id="lock">
  <div class="card">
    <h1>請輸入密碼</h1>
    <p>資料已加密，輸入密碼後才能查詢。</p>
    <form id="lf" autocomplete="off">
      <input id="pw" type="password" inputmode="numeric" placeholder="密碼" autofocus>
      <label class="rm"><input type="checkbox" id="rm"> 這台電腦記住密碼（共用電腦請勿勾選）</label>
      <button class="btn" type="submit" id="lb">解鎖</button>
    </form>
    <div class="msg" id="lmsg"></div>
  </div>
</section>

<main id="app" hidden>
  <section class="card">
    <form class="search" id="sf" autocomplete="off">
      <input id="q" placeholder="手機或團號" inputmode="text">
      <button class="btn" type="submit">查詢</button>
    </form>
    <p class="hint">輸入手機（例 0912362634）、團號（例 T00004 或 4），也可以打姓名、團名或號碼布。按 Esc 回到這裡。</p>
    <div class="msg" id="msg"></div>
  </section>

  <!-- 首頁 -->
  <section class="card" id="home">
    <h2>寄送總覽</h2>
    <div class="stats" id="stats" style="margin-top:12px"></div>
  </section>

  <!-- 多筆 -->
  <section class="card" id="list" hidden>
    <h2 id="listT"></h2>
    <div id="listB"></div>
  </section>

  <!-- 單筆 -->
  <div id="detail" hidden>
    <section class="card" id="top"></section>
    <nav class="tabs" id="tabs">
      <button class="tab" data-p="items"><span class="k">1</span>物資內容</button>
      <button class="tab" data-p="members"><span class="k">2</span>成員名單</button>
      <button class="tab" data-p="ship"><span class="k">3</span>寄件資料</button>
      <button class="tab" data-p="extra"><span class="k">4</span>補寄登記</button>
    </nav>
    <section class="card pane" id="p-items"></section>
    <section class="card pane" id="p-members"></section>
    <section class="card pane" id="p-ship"></section>
    <section class="card pane" id="p-extra"></section>
  </div>
</main>

<footer id="foot" hidden>
  資料來源：參加者資料 Excel（11/06）＋ 打包檔（團號排序）．資料已加密<br>
  補寄紀錄全體同事共用<span class="sync" id="sync"></span>｜<button id="out">登出</button>
</footer>

const API_URL = (window.CBD_API_URL || '').trim();
const KEEP = 'cbd2026_key_v1', WHO = 'cbd2026_who';

const $ = s => document.querySelector(s);

const dig = s => String(s ?? '').replace(/\D/g, '');

const st = { get(k, w) { try { return (w || localStorage).getItem(k); } catch (e) { return null; } }, set(k, v, w) { try { (w || localStorage).setItem(k, v); } catch (e) { } }, del(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) { } } };

/* ---------- 解密 ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = u => [...new Uint8Array(u)].map(x => x.toString(16).padStart(2, '0')).join('');
const unhex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
async function deriveBits(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(ENC.salt), iterations: ENC.iter }, base, 512));
}
async function unlockWith(bits) {
  const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-GCM', false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(ENC.iv) }, key, b64(ENC.ct));
  const txt = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  DATA = JSON.parse(txt); byTid = Object.fromEntries(DATA.map(t => [t.tid, t]));
  TOKEN = hex(bits.slice(32));
  $('#lock').hidden = true; $('#app').hidden = false; $('#foot').hidden = false;
  initStats(); $('#q').focus(); syncExtra();
}
$('#lf').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('#pw').value.trim(); if (!pw) return;
  $('#lb').disabled = true; $('#lb').textContent = '解鎖中…'; $('#lmsg').textContent = '';
  try {
    const bits = await deriveBits(pw);
    await unlockWith(bits);
    st.set(KEEP, hex(bits), $('#rm').checked ? localStorage : sessionStorage);
  } catch (err) {
    $('#lmsg').textContent = window.crypto && crypto.subtle ? '密碼錯誤，請再試一次。' : '這個瀏覽器不支援，請改用 Chrome 或 Edge。';
    $('#pw').select();
  }
  $('#lb').disabled = false; $('#lb').textContent = '解鎖';
});
$('#out').addEventListener('click', () => { st.del(KEEP); location.reload(); });
(async () => {
  const k = st.get(KEEP) || st.get(KEEP, sessionStorage);
  if (k) { try { await unlockWith(unhex(k)); } catch (e) { st.del(KEEP); } }
})();

/* ---------- 共用補寄紀錄（Google 試算表後台） ---------- */
function setSync(t, err) { const el = $('#sync'); el.textContent = t ? '．' + t : ''; el.className = 'sync' + (err ? ' err' : ''); }
async function api(body) {
  if (!API_URL) throw new Error('nourl');
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, token: TOKEN }), redirect: 'follow' });
  const j = await r.json();
  if (!j.ok) throw new Error(j.err || 'fail');
  return j;
}
function applyRows(rows) {
  const x = {};
  (rows || []).forEach(r => { if (byTid[r.tid]) (x[r.tid] = x[r.tid] || []).push(r); });
  EXTRA = x;
}
let syncing = false;
async function syncExtra() {
  if (!API_URL) { setSync('後台尚未設定', true); return; }
  if (syncing) return; syncing = true;
  try {
    const j = await api({ action: 'list' }); const before = JSON.stringify(EXTRA[CUR && CUR.tid] || []);
    applyRows(j.rows); setSync('已同步 ' + new Date().toTimeString().slice(0, 5));
    if (CUR && JSON.stringify(EXTRA[CUR.tid] || []) !== before) { renderTop(); if (!$('#xTrk') || !$('#xTrk').value) renderExtra(); }
  } catch (e) { setSync(e.message === 'auth' ? '後台密碼不符' : '補寄紀錄連線失敗，稍後自動重試', true); }
  syncing = false;
}
setInterval(() => { if (TOKEN && !document.hidden) syncExtra(); }, 60000);
document.addEventListener('visibilitychange', () => { if (TOKEN && !document.hidden) syncExtra(); });

const fmtTrk = t => esc(t.slice(0, 3)) + '<em>' + esc(t.slice(3, 6)) + '</em>' + esc(t.slice(6));
const SPECIAL = n => /加購|袖套/.test(n);

function initStats() {

  ].map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
}

/* ---------- 搜尋 ---------- */
function search(raw) {
  let q = fw(raw).trim();
  q = q.replace(/^\+?\s*886[\s-]*0?/, '0');
  if (!q) return [];
  const d = dig(q), res = new Map();
  const add = (t, why, who) => { if (!res.has(t.tid)) res.set(t.tid, { t, why, who }); };
  // 團號
  const mt = q.match(/^[tT]\s*0*(\d{1,5})$/) || (d === q && d.length <= 4 ? [0, d] : null);
  if (mt) { const id = 'T' + String(+mt[1]).padStart(5, '0'); if (byTid[id]) add(byTid[id], '團號'); }
  if (/^[\d\s-]+$/.test(q) && d.length >= 3) {
    DATA.forEach(t => {
      if (d.length >= 6) {
        if (dig(t.lphone).includes(d)) add(t, '領隊手機');
        t.runners.forEach(r => { if (r.phone && dig(r.phone).includes(d)) add(t, '團員手機：' + r.name, r.bib); });
        if (d.length === 14 && t.ship.trk === d) add(t, '郵件號碼');
        (EXTRA[t.tid] || []).forEach(x => { if (d.length === 14 && x.trk === d) add(t, '補寄號碼'); });
      } else {
        t.runners.forEach(r => { if (dig(r.bib) === d && d.length === 4) add(t, '號碼布 ' + r.bib + '：' + r.name, r.bib); });
      }
    });
  }
  if (!/^[\d\s-]+$/.test(q)) {
    const s = q.replace(/\s/g, '').toLowerCase();
    DATA.forEach(t => {
      if (t.leader.replace(/\s/g, '').toLowerCase().includes(s)) add(t, '領隊：' + t.leader);
      t.runners.forEach(r => { if (r.name.replace(/\s/g, '').toLowerCase().includes(s)) add(t, '團員：' + r.name, r.bib); });
      if (t.name !== '個人' && t.name.replace(/\s/g, '').toLowerCase().includes(s)) add(t, '團名');
      const sb = s.replace(/-/g, ''); t.runners.forEach(r => { if (r.bib.toLowerCase().replace(/-/g, '') === sb) add(t, '號碼布 ' + r.bib + '：' + r.name, r.bib); });
    });
  }
  return [...res.values()];
}

function show(id) {

$('#sf').addEventListener('submit', e => {

let CUR = null, CUR_WHO = null, CUR_PANE = 'items';

function copyText(txt, btn) {
  const ok = () => { const o = btn.textContent; btn.textContent = '已複製 ✓'; btn.classList.add('done'); setTimeout(() => { btn.textContent = o; btn.classList.remove('done'); }, 1400); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(ok, () => fb());
  else fb();
  function fb() { const a = document.createElement('textarea'); a.value = txt; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); ok(); } catch (e) { } a.remove(); }
}

function openTeam(tid, who) {

  if (t.ship.trk) trk = `<div class="trk"><div class="lab">郵件號碼（14 碼）</div><code>${fmtTrk(t.ship.trk)}</code>
      <button class="copy" data-c="${t.ship.trk}">複製</button></div>`;
  ex.forEach(x => trk += `<div class="trk"><div class="lab">補寄號碼（${esc(x.date)}${x.what ? '．' + esc(x.what) : ''}）</div><code>${esc(x.trk)}</code><button class="copy" data-c="${esc(x.trk)}">複製</button></div>`);
  const cr = CUR_WHO && t.n > 1 && t.runners.find(r => r.bib === CUR_WHO);
  const caller = cr ? `<div class="caller">☎ 查到的是團員 ${esc(cr.name)}（號碼布 ${esc(cr.bib)}），在成員名單中已標黃</div>` : '';
  let note = '';
  if (t.xs) note += `<div class="note xs">包裹內有蓋「向山美利達」店章的租車券，車友需到向山美利達租車。</div>`;
  if (t.ship.type === 'lost') note += `<div class="note xs">Excel 的便利包欄寫「${esc(t.ship.code)}」，所以沒有郵件號碼。找到號碼後，可以在「補寄登記」補上。</div>`;
  if (t.ship.type === 'onsite') note += `<div class="note on">外國人團隊，現場報到。物資已抓好，沒有郵寄，所以沒有郵件號碼。</div>`;
  $('#top').innerHTML = `<div class="head"><span class="tid">${t.tid}</span><span class="tname">${esc(t.name)}</span><span class="tn">${t.n} 人・領隊 ${esc(t.leader)}</span></div>
     <div class="badges">${b}</div>${caller}${trk}${note}`;
}
$('#top').addEventListener('click', e => { const b = e.target.closest('.copy'); if (b) copyText(b.dataset.c, b); });

function renderItems() {
  const m = totals(CUR), g = { '機能袖套': [], '加購車衣': [], '加購項目': [], '基本物資': [] };
  for (const [n, q] of m) {
    if (n.startsWith('機能袖套')) g['機能袖套'].push([n.replace('機能袖套', '').replace(/[()]/g, ''), q, 1]);
    else if (n.startsWith('加購車衣')) g['加購車衣'].push([n.replace('加購車衣', '').replace(/[()]/g, ''), q, 1]);
    else if (n.includes('加購')) g['加購項目'].push([n, q, 1]);
    else g['基本物資'].push([n, q, 0]);
  }
  const ord = ['XS', 'S', 'M', 'L', 'XL', '2L', '3L', '4L'];
  ['機能袖套', '加購車衣'].forEach(k => g[k].sort((a, b) => ord.indexOf(a[0]) - ord.indexOf(b[0])));
  let h = `<h3>這一包應有的物資<small>打包檔（團號排序）第 ${CUR.page} 頁</small></h3>`;
  for (const k in g) {
    if (!g[k].length) continue;
    const sum = g[k].reduce((s, x) => s + x[1], 0);
    h += `<div class="grp"><div class="grp-t">${k}${k === '基本物資' ? '' : '　共 ' + sum}</div><div class="tiles">` +
      g[k].map(([n, q, hi]) => `<div class="tile${hi ? ' hi' : ''}"><div class="n">${esc(n)}</div><div class="q">× ${q}</div></div>`).join('') + '</div></div>';
  }
  $('#p-items').innerHTML = h;
}

function renderMembers() {
  const t = CUR;
  let h = `<h3>成員名單<small>${t.n} 人</small></h3>`;
  h += t.runners.map(r => `<div class="mem${CUR_WHO && r.bib === CUR_WHO ? ' me' : ''}">
     <div class="mrow"><span class="bib">${esc(r.bib)}</span><span class="mname">${esc(r.name)}</span>
     <span class="mrace">${esc(shortRace(r.race))}</span>${r.phone ? `<span class="mphone">${esc(r.phone)}</span>` : ''}</div>
     <div class="chips">${r.items.map(([n, q]) => `<span class="chip${SPECIAL(n) ? ' hi' : ''}">${esc(n)}${q > 1 ? ' ×' + q : ''}</span>`).join('')}</div></div>`).join('');
  $('#p-members').innerHTML = h;
}

function renderShip() {
  const t = CUR;
  $('#p-ship').innerHTML = `<h3>寄件資料</h3><dl>
     <dt>收件人</dt><dd>${esc(t.leader)}</dd>
     <dt>手機</dt><dd>${esc(t.lphone)}</dd>
     <dt>地址</dt><dd>${esc(t.addr)}</dd>
     <dt>E-mail</dt><dd>${esc(t.email) || '—'}</dd>
     <dt>寄送方式</dt><dd>${shipText(t)}</dd>
     <dt>郵件號碼</dt><dd style="font-family:Consolas,monospace">${t.ship.trk || '—'}</dd>
     <dt>報到方式</dt><dd>${esc(t.way)}</dd>
     <dt>打包檔</dt><dd>團號排序版 第 ${t.page} 頁</dd></dl>`;
}

function renderExtra() {
  const t = CUR, ex = EXTRA[t.tid] || [];
  let h = `<h3>補寄登記<small>所有同事共用，登記後大家都看得到</small></h3>`;
  if (!API_URL) h += '<div class="warnbox">補寄後台還沒設定（config.js 的網址是空的），目前無法登記。</div>';
  h += ex.length ? ex.map(x => `<div class="rec"><code>${esc(x.trk)}</code><span class="d">${esc(x.date)}</span>${x.by ? `<span class="by">登記人：${esc(x.by)}</span>` : ''}
       <button class="del" data-id="${esc(x.id)}">刪除</button><div class="w">${esc(x.what) || '（未填內容）'}</div></div>`).join('')
    : '<div class="empty">目前沒有補寄紀錄。</div>';
  h += `<form class="form" id="xf"><label>補寄郵件號碼（14 碼）</label><input id="xTrk" inputmode="numeric" placeholder="例 08100154102818">
       <label>補寄內容／原因</label><input id="xWhat" placeholder="例 少一個機能袖套(M)，補寄給 陳聖賢">
       <label>登記人</label><input id="xBy" placeholder="你的名字" value="${esc(st.get(WHO) || '')}">
       <button class="btn blue" type="submit" id="xBtn"${API_URL ? '' : ' disabled'}>新增補寄紀錄</button></form>`;
  $('#p-extra').innerHTML = h;
}
$('#p-extra').addEventListener('submit', async e => {
  e.preventDefault();
  const trk = dig(fw($('#xTrk').value)), what = $('#xWhat').value.trim(), by = $('#xBy').value.trim();
  if (trk.length !== 14) { alert('郵件號碼要 14 碼數字，目前是 ' + trk.length + ' 碼。'); return; }
  if (by) st.set(WHO, by);
  const btn = $('#xBtn'); btn.disabled = true; btn.textContent = '儲存中…';
  const tid = CUR.tid;
  try { const j = await api({ action: 'add', tid, trk, what, by }); applyRows(j.rows); setSync('已同步 ' + new Date().toTimeString().slice(0, 5)); if (CUR.tid === tid) { renderTop(); renderExtra(); } }
  catch (err) { alert('儲存失敗，請確認網路後再試一次。（' + err.message + '）'); btn.disabled = false; btn.textContent = '新增補寄紀錄'; }
});
$('#p-extra').addEventListener('click', async e => {
  const b = e.target.closest('.del'); if (!b) return;
  if (!confirm('確定刪除這筆補寄紀錄？所有同事都會看不到。')) return;
  b.disabled = true; b.textContent = '刪除中…';
  try { const j = await api({ action: 'del', id: b.dataset.id }); applyRows(j.rows); renderTop(); renderExtra(); }
  catch (err) { alert('刪除失敗，請再試一次。（' + err.message + '）'); b.disabled = false; b.textContent = '刪除'; }
});

function setPane(p) {
  CUR_PANE = p;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  ['items', 'members', 'ship', 'extra'].forEach(x => $('#p-' + x).hidden = x !== p);
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) setPane(b.dataset.p); });

/* ---------- 鍵盤 ---------- */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('#q').focus(); $('#q').select(); return; }
  if ($('#detail').hidden || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const k = { '1': 'items', '2': 'members', '3': 'ship', '4': 'extra' }[e.key];
  if (k) setPane(k);
});

</script>
</body>
</html>
